name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.329"
  # Los tests que crean commits en repos efímeros necesitan una identidad
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  synapse:
    name: synapse (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    # Windows es bloqueante desde T-24w (#3); los tests que asumen POSIX corren como xfail (tests/conftest.py)
    defaults:
      run:
        shell: bash
        working-directory: plugins/synapse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest
      # Fallback determinista: Laya (torch y el delta LFS) se prueba en local con --laya gpu
      - run: python -m pytest -q

  session-handoff:
    name: session-handoff (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        shell: bash
      # Los tests importan claude-code/testing: solo los resuelve `claude plugin test`
      - run: claude plugin test plugins/session-handoff
      - uses: oven-sh/setup-bun@v2
      # Acciones y hosts (Codex, Antigravity) y el bundle versionado al día con el código
      - run: bun test tests/cli
        working-directory: plugins/session-handoff
      - run: bun run build && git diff --exit-code dist/
        working-directory: plugins/session-handoff
        shell: bash

  repo:
    name: manifiestos y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --quiet pytest
      - run: python scripts/bump.py --check
      - run: python -m pytest -q scripts/tests
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude plugin validate --strict plugins/synapse
      - run: claude plugin validate --strict plugins/session-handoff
      - run: claude plugin validate --strict .
