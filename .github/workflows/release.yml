name: Release

# Un tag <plugin>-v<semver> sobre main publica plugins/<plugin> en su espejo (subtree split, fast-forward, LFS).
on:
  push:
    tags:
      - "synapse-v*"
      - "session-handoff-v*"
      - "spanish-latam-style-v*"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Plugin y versión del tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "plugin=${tag%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: El tag apunta a un commit de main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/bump.py --check
      - name: Llave del espejo
        env:
          SYNAPSE_KEY: ${{ secrets.MIRROR_DEPLOY_KEY_SYNAPSE }}
          HANDOFF_KEY: ${{ secrets.MIRROR_DEPLOY_KEY_HANDOFF }}
          SPANISH_KEY: ${{ secrets.MIRROR_DEPLOY_KEY_SPANISH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          case "${{ steps.tag.outputs.plugin }}" in
            synapse) key="$SYNAPSE_KEY" ;;
            session-handoff) key="$HANDOFF_KEY" ;;
            spanish-latam-style) key="$SPANISH_KEY" ;;
            *) echo "plugin desconocido" >&2; exit 1 ;;
          esac
          printf '%s\n' "$key" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Publicar espejo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes
        run: >
          python scripts/release.py --mirror "${{ steps.tag.outputs.plugin }}"
          --ref "$GITHUB_SHA" --expect-version "${{ steps.tag.outputs.version }}" --push
